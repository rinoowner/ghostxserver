<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GHOST X SERVER - Controller</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Anybody:wght@700;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-primary-fixed": "#410000",
            "on-secondary": "#2f3131",
            "surface-container": "#1d2027",
            "on-primary": "#690100",
            "tertiary-fixed": "#e2e2e8",
            "surface-variant": "#32353c",
            "on-secondary-container": "#b4b5b5",
            "on-tertiary-fixed-variant": "#45474b",
            "surface-container-low": "#191c23",
            "primary-fixed-dim": "#ffb4a8",
            "tertiary": "#c6c6cc",
            "on-tertiary-container": "#282a2e",
            "error": "#ffb4ab",
            "surface-tint": "#ffb4a8",
            "on-surface": "#e0e2ec",
            "secondary": "#c6c6c7",
            "primary-fixed": "#ffdad4",
            "surface-container-highest": "#32353c",
            "on-secondary-fixed-variant": "#454747",
            "secondary-container": "#454747",
            "on-primary-fixed-variant": "#930100",
            "on-background": "#e0e2ec",
            "on-tertiary": "#2f3035",
            "surface-bright": "#363941",
            "secondary-fixed-dim": "#c6c6c7",
            "error-container": "#93000a",
            "background": "#10131a",
            "surface-container-high": "#272a31",
            "outline-variant": "#603e39",
            "on-error": "#690005",
            "inverse-surface": "#e0e2ec",
            "surface": "#10131a",
            "primary-container": "#ff5540",
            "secondary-fixed": "#e2e2e2",
            "primary": "#ffb4a8",
            "on-tertiary-fixed": "#1a1c20",
            "on-surface-variant": "#ebbbb4",
            "inverse-on-surface": "#2d3038",
            "tertiary-fixed-dim": "#c6c6cc",
            "tertiary-container": "#8f9096",
            "inverse-primary": "#c00100",
            "surface-dim": "#10131a",
            "surface-container-lowest": "#0b0e15",
            "outline": "#b18780",
            "on-primary-container": "#5c0000",
            "on-error-container": "#ffdad6",
            "on-secondary-fixed": "#1a1c1c"
          },
          "borderRadius": {
            "DEFAULT": "12px",
            "lg": "16px",
            "xl": "20px",
            "2xl": "24px",
            "full": "9999px"
          },
          "spacing": {
            "gutter": "16px",
            "container-padding": "24px"
          },
          "fontFamily": {
            "label-caps": ["Space Grotesk"],
            "headline-md": ["Anybody"],
            "headline-lg": ["Anybody"],
            "body-sm": ["JetBrains Mono"],
            "body-lg": ["JetBrains Mono"]
          }
        }
      }
    };
  </script>
<style>
    body {
      background-color: transparent;
      overflow: hidden;
    }
    .scanline {
      background: linear-gradient(to bottom, transparent 50%, rgba(255, 255, 255, 0.02) 50%);
      background-size: 100% 4px;
    }
    .red-glow {
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
    }
    .custom-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #ff5540;
      cursor: pointer;
      border-radius: 50%; /* Circle thumb like in image */
    }
    .custom-range {
      background: #32353c;
      height: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body class="font-body-lg text-on-surface">
<!-- Main UI Shell -->
<main class="relative z-10 p-2">
<!-- Controller Modal -->
<div class="w-full max-w-md border border-outline-variant shadow-2xl relative overflow-hidden red-glow bg-surface-container-low/80 backdrop-blur-md rounded-2xl">
<!-- Texture Layer -->
<div class="absolute inset-0 scanline pointer-events-none opacity-20"></div>
<!-- Top Header -->
<div class="flex items-center justify-between p-4 bg-surface-container-high relative z-20 rounded-t-2xl">
<div class="flex items-center gap-3">
<div class="w-8 h-8 flex items-center justify-center bg-primary-container text-on-primary-container rounded-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">terminal</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] font-label-caps text-primary leading-none">SEARCHING...</span>
<span class="text-lg font-bold tracking-tighter">GHOST X SERVER</span>
</div>
</div>
<button onclick="Android.closeWindow()" class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content Area -->
<div class="p-6 space-y-6 relative z-20">
<!-- Target Info Panel -->
<div class="bg-surface-container-lowest border border-white/5 p-4 space-y-2 relative rounded-lg">
<div class="pt-2 space-y-1">
<div class="flex items-baseline gap-2">
<span class="text-xs text-on-surface-variant font-bold">IP:</span>
<span id="ip_display" class="text-sm font-bold text-primary tracking-widest">192.168.1.1</span>
</div>
<div class="flex items-baseline gap-2">
<span class="text-xs text-on-surface-variant font-bold">PORT:</span>
<span id="port_display" class="text-sm font-bold text-primary tracking-widest">8080</span>
</div>
</div>
</div>
<!-- Slider Section -->
<div class="space-y-4">
<div class="flex justify-between items-center">
<span class="text-xs font-bold text-on-surface">Attack Time</span>
<span id="duration_label" class="text-xs text-primary font-bold">Attack Time: 180s</span>
</div>
<div class="relative w-full h-1 bg-surface-container-highest rounded-full">
<input id="duration_slider" oninput="document.getElementById('duration_label').innerText = 'Attack Time: ' + this.value + 's'" class="absolute w-full h-1 bg-transparent accent-primary-container cursor-pointer appearance-none custom-range" max="600" min="0" type="range" value="180"/>
</div>
</div>
<!-- Secondary Actions Grid -->
<div class="grid grid-cols-2 gap-4">
<button onclick="Android.getIpPort()" class="border border-outline-variant px-4 py-3 flex items-center justify-center group hover:bg-surface-variant transition-all rounded-lg">
<span class="text-xs font-bold text-[#4ade80] group-hover:brightness-125">GET IP PORT</span>
</button>
<button onclick="Android.stopVpn()" class="border border-outline-variant px-4 py-3 flex items-center justify-center group hover:bg-surface-variant transition-all rounded-lg">
<span class="text-xs font-bold text-[#f87171] group-hover:brightness-125">STOP VPN</span>
</button>
</div>
<!-- Primary Action Button -->
<button onclick="Android.startAttack(document.getElementById('duration_slider').value)" class="w-full bg-primary-container py-4 group relative overflow-hidden active:scale-[0.98] transition-all rounded-lg">
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="relative z-10 text-lg font-bold text-on-primary-container text-center block tracking-tight">START ATTACK</span>
</button>
<!-- Status Footer -->
<div class="flex items-center justify-between border-t border-outline-variant/30 pt-4">
<div class="flex items-center gap-2">
<div class="w-2 h-2 bg-primary-container animate-pulse"></div>
<span class="text-[10px] font-label-caps text-on-surface-variant uppercase">System Standby</span>
</div>
<span class="text-[10px] opacity-50 font-bold">GHOST_SHELL_V.4.2</span>
</div>
</div>
</div>
</main>
</body></html>
